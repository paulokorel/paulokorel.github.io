<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paulo Korel - Portfólio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #0b0b0b;
  color: white;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  background: rgba(10,10,10,0.8);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px 20px;
  z-index: 10;
}

header img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  object-fit: cover;
}

header h1 {
  font-size: 16px;
}

/* GRID */
.gallery {
  column-count: 4;
  column-gap: 12px;
  padding: 12px;
}

.item {
  break-inside: avoid;
  margin-bottom: 12px;
  cursor: pointer;
  border-radius: 12px;
  overflow: hidden;
}

.item img, .item video {
  width: 100%;
  display: block;
  transition: 0.4s;
}

.item:hover img,
.item:hover video {
  transform: scale(1.05);
}

/* RESPONSIVO */
@media (max-width: 1000px) {
  .gallery { column-count: 3; }
}
@media (max-width: 700px) {
  .gallery { column-count: 2; }
}
@media (max-width: 500px) {
  .gallery { column-count: 1; }
}

/* OVERLAY */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.9);
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.overlay-content {
  display: flex;
  gap: 30px;
  max-width: 1100px;
  width: 100%;
  align-items: center;
}

.overlay img, .overlay video, .overlay iframe {
  max-width: 60%;
  border-radius: 12px;
}

.description {
  max-width: 40%;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 32px;
  cursor: pointer;
}

.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  cursor: pointer;
  color: white;
}

.left { left: 20px; }
.right { right: 20px; }

/* MOBILE */
@media (max-width: 700px) {
  .overlay-content {
    flex-direction: column;
  }
  .overlay img, .overlay video, .overlay iframe {
    max-width: 100%;
  }
  .description {
    max-width: 100%;
  }
}
</style>

</head>

<body>

<header>
  <img src="images/perfil.jpg">
  <h1>Paulo Korel - O Poder da Imagem & Som</h1>
</header>

<div class="gallery">

  <div class="item" onclick="openOverlay(0)">
    <img src="images/img1.jpg" loading="lazy">
  </div>

  <div class="item" onclick="openOverlay(1)">
    <img src="images/img2.jpg" loading="lazy">
  </div>

  <div class="item" onclick="openOverlay(2)">
    <video src="videos/video.mp4" muted></video>
  </div>

  <div class="item" onclick="openOverlay(3)">
    <img src="images/thumb.jpg" loading="lazy">
  </div>

</div>

<!-- OVERLAY -->

<div class="overlay" id="overlay" onclick="closeOverlay()">
  <span class="close" onclick="closeOverlay()">✕</span>
  <div class="nav left" onclick="prevItem()">❮</div>
  <div class="nav right" onclick="nextItem()">❯</div>
  <div class="overlay-content" onclick="event.stopPropagation()" id="overlayContent"></div>
</div>

<script>
const items = [
  {src: "Artboard 1.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 2.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 3.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 4.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 5.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 6.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 7.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 8.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 9.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 10.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 11.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "Artboard 12.jpg", text: "Ensaio Urbano - Praça Roosevelt", type: "image"},
  {src: "videos/video.mp4", text: "Performance ao vivo", type: "video"},
  {src: "https://www.youtube.com/embed/SEU_VIDEO", text: "Cover guitarra", type: "youtube"}
];

let currentIndex = 0;

function openOverlay(index) {
  currentIndex = index;
  renderOverlay();
  document.getElementById("overlay").style.display = "flex";
}

function renderOverlay() {
  const item = items[currentIndex];
  let media = "";

  if(item.type === "video"){
    media = `<video src="${item.src}" controls autoplay></video>`;
  } else if(item.type === "youtube"){
    media = `<iframe src="${item.src}" frameborder="0" allowfullscreen></iframe>`;
  } else {
    media = `<img src="${item.src}">`;
  }

  document.getElementById("overlayContent").innerHTML = `
    ${media}
    <div class="description">
      <h2>Projeto</h2>
      <p>${item.text}</p>
    </div>
  `;
}

function closeOverlay() {
  document.getElementById("overlay").style.display = "none";
}

function nextItem() {
  currentIndex = (currentIndex + 1) % items.length;
  renderOverlay();
}

function prevItem() {
  currentIndex = (currentIndex - 1 + items.length) % items.length;
  renderOverlay();
}

document.addEventListener("keydown", (e) => {
  if(e.key === "ArrowRight") nextItem();
  if(e.key === "ArrowLeft") prevItem();
  if(e.key === "Escape") closeOverlay();
});
</script>

</body>
</html>
