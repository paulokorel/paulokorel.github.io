<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #0b0b0b;
  color: white;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  background: rgba(10,10,10,0.8);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px 20px;
  z-index: 10;
}

header-left {
  display: flex;
  align-items: left;
  gap: 15px;
  column-count: 2;
}

header img {
  width: 30px;
  height: 30px;
  object-fit: cover;
}

header h1 {
  font-size: 20px;
}

/*MUSIC PLAYER*/

.music-player {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 15px;
}

.music-player img {
  width: 65px;
  height: 65px;
  border-radius: 8px;
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.player-info {
  display: flex;
  flex-direction: column;
  width: 180px;
}

#trackName {
  font-size: 12px;
}

.progress-container {
  width: 100%;
  height: 6px;
  background: #333;
  cursor: pointer;
  margin: 5px 0;
}

.progress {
  height: 100%;
  width: 0%;
  background: #fff;
}

.controls button {
  width: 30px;
  height: 30px;
  background: #333;
  border-radius: 0px;
  color: #fff;
  cursor: pointer;
  margin: 8px 12px;
}

input[type=range] {
  width: 80px;
}

/* GRID */
.gallery {
  column-count: 6;
  column-gap: 12px;
  padding: 12px;
}

.item {
  break-inside: avoid;
  margin-bottom: 12px;
  cursor: pointer;
  border-radius: 12px;
  overflow: hidden;
}

.item img, .item video {
  width: 100%;
  display: block;
  transition: 0.4s;
}

.item:hover img,
.item:hover video {
  transform: scale(1.05);
}

/* RESPONSIVO */
@media (max-width: 700px) {
  .gallery { column-count: 3; }
  .gallery { column-gap: 8px; padding: 8px; } 

header {
  height: 70%;
  align-items: flex-start;
  flex-direction: column;
  {column-count: 2;}
} 

 header-left {
  width: 50%;
 }

 music-player {
  width: 50%;
  margin-top: 5px;
 }             

}

/* OVERLAY */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(8px);
  z-index: 999;
}

/* conteúdo central */
.overlay-content {
  flex-direction: column;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  gap: 0px;
  max-width: 600px;
  width: 90%;
  align-items: center;
}

/* mídia */
.overlay img,
.overlay video,
.overlay iframe {
  max-width: 75%;
  border-radius: 10px;
}

/* descrição */
  .description {
    max-width: 20%;
    font-size: 14px;
  }

  .nav {
    font-size: 35px;
    padding: 8px;
  }

/* fechar */
.close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 30px;
  cursor: pointer;
  z-index: 1001;
}

/* setas */
.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 50px;
  cursor: pointer;
  color: white;
  z-index: 1001;
  padding: 10px;
  user-select: none;
}

.left { left: 20px; }
.right { right: 20px; }

.gallery-wrapper {
  position: relative;
  max-height: 150vh;
  overflow: hidden;
}

/* Fade out */
.fade-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100px;
  margin-top: -10px; /* sobrepõe as imagens */

  background: linear-gradient(to top, #0b0b0b 5%, transparent);

  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 40px;

  z-index: 10;
}

.fade-bottom button {
  background: white;
  color: black;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 500;
}

/*SOCIAL*/
.socials {
  display: flex;
  gap: 10px;
}

.socials a {

  text-decoration: none;
  color: white;
  font-size: 12px;
  opacity: 0.7;
  transition: 0.3s;
}

.socials a:hover {
  opacity: 1;
}

</style>

let currentIndex = 0;

function openOverlay(index) {
  currentIndex = index;
  renderOverlay();

  document.getElementById("overlay").style.display = "flex";
}

function renderOverlay() {
  const item = items[currentIndex];
  let media = "";

function pauseMusicForVideo() {
  if (isPlaying) {
    wasPlayingBeforeVideo = true;
    fadeOut();
  } else {
    wasPlayingBeforeVideo = false;
  }
}

  if(item.type === "video"){
  pauseMusicForVideo();
    media = `<video src="${item.src}" controls autoplay></video>`;
  } else if(item.type === "youtube"){
    media = `<iframe src="${item.src}" frameborder="0" allowfullscreen></iframe>`;
  } else {
    media = `<img src="${item.src}">`;
  }

  document.getElementById("overlayContent").innerHTML = `
    ${media}
    <div class="description">
      <h2></h2>
      <p>${item.text}</p>
    </div>
  `;
}

function closeOverlay() {
      resumeMusicAfterVideo();

  const container = document.getElementById("overlayContent");

  // pausa TODOS vídeos
  container.querySelectorAll("video").forEach(v => {
    v.pause();
    v.currentTime = 0;
  });

  container.innerHTML = "";
  document.getElementById("overlay").style.display = "none";


}

function nextItem(e) {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % items.length;
  renderOverlay();
}

function prevItem(e) {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + items.length) % items.length;
  renderOverlay();
}

document.addEventListener("keydown", (e) => {
  if(e.key === "ArrowRight") nextItem();
  if(e.key === "ArrowLeft") prevItem();
  if(e.key === "Escape") closeOverlay();
});

const tracks = [
  {
    src: "Ressureição.wav",
    name: "Ressureição - Trilha Sonora Original do Curta-Metragem 'FOFA' por Paulo Korel",
    cover: "capa-fofa.png"
  },
  {
    src: "Paraíso",
    name: "Paraíso - Trilha Sonora Original do Curta-Metragem 'FOFA' por Paulo Korel",
    cover: "capa-fofa.png"
  },
  {
    src: "Meu Processo é o Outro (Olga Kos).wav",
    name: "Meu Processo é o Outro - Trilha Sonora Original do Projeto - ONDA #15 Atraves.tv",
    cover: "capa-atraves.png"
  },
  {
    src: "A Vida é uma Só (Patrícia Celanti).wav",
    name: "A Vida é uma Só - Trilha Sonora Original do Projeto - ONDA #15 Atraves.tv",
    cover: "capa-atraves.png"
  }  
];

let audio = new Audio();
let currentTrack = 0;
let isPlaying = false;

const playBtn = document.getElementById("playBtn");
const trackName = document.getElementById("trackName");
const cover = document.getElementById("cover");
const progress = document.getElementById("progress");

function loadTrack(index) {
  audio.src = tracks[index].src;
  trackName.innerText = tracks[index].name;
  cover.src = tracks[index].cover;
}

function togglePlay() {
  if (isPlaying) {
    fadeOut();
  } else {
    audio.play();
    fadeIn();
    playBtn.innerText = "⏸";
  }
  isPlaying = !isPlaying;
}

function nextTrack() {
  currentTrack = (currentTrack + 1) % tracks.length;
  loadTrack(currentTrack);
  audio.play();
  fadeIn();
  playBtn.innerText = "⏸";
  isPlaying = true;
}

function prevTrack() {
  currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
  loadTrack(currentTrack);
  audio.play();
  fadeIn();
  playBtn.innerText = "⏸";
  isPlaying = true;
}

/* PROGRESSO */
audio.ontimeupdate = () => {
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";
};

function seek(e) {
  const width = e.currentTarget.clientWidth;
  const clickX = e.offsetX;
  audio.currentTime = (clickX / width) * audio.duration;
}

/*SHUFFLE */
function shuffleItems() {
  const gallery = document.querySelector(".gallery");
  const items = Array.from(gallery.querySelectorAll(".item"));

  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }

  items.forEach(item => gallery.appendChild(item));
}

function reshuffle() {
  shuffleItems();
}

/*FADE*/
function loadMore() {
  shuffleItems();

  // sobe suavemente
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* VOLUME */
function setVolume(val) {
  audio.volume = val;
}

/* FADE */
function fadeIn() {
  audio.volume = 0;
  let vol = 0;
  const fade = setInterval(() => {
    if (vol < 1) {
      vol += 0.05;
      audio.volume = vol;
    } else {
      clearInterval(fade);
    }
  }, 50);
}

function fadeOut() {
  let vol = audio.volume;
  const fade = setInterval(() => {
    if (vol > 0) {
      vol -= 0.05;
      audio.volume = vol;
    } else {
      clearInterval(fade);
      audio.pause();
      playBtn.innerText = "▶";
    }
  }, 50);
}

/* INTEGRAÇÃO COM VÍDEO */
function resumeMusicAfterVideo() {
  if (wasPlayingBeforeVideo) {
    audio.play();
    fadeIn();
    playBtn.innerText = "⏸";
    isPlaying = true;
  }
}
/* INIT */
loadTrack(currentTrack);
